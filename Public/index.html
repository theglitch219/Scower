<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scower — Human Intelligence Marketplace</title>
<style>
:root{--bg:#fff;--card:#f7f5fb;--text:#17131f;--muted:#716a7c;--line:#e7e2ed;--p:#7c3aed;--soft:#eee7ff;--dark:#17131f}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}
.wrap{max-width:1120px;margin:auto;padding:0 22px}.nav{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px}.mark{width:38px;height:38px;border-radius:12px;background:var(--p);display:grid;place-items:center}.mark svg{width:25px;height:25px}
.navlinks{display:flex;gap:26px;font-size:13px}.navlinks a{color:var(--muted);text-decoration:none}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:white;padding:11px 15px;border-radius:11px;font-weight:800;font-size:12px}.primary{background:var(--p);color:#fff;border-color:var(--p)}.ghost{background:var(--soft);color:var(--p)}
.hero{text-align:center;padding:92px 0 70px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.16em;color:var(--p)}h1{font-size:clamp(44px,7vw,78px);line-height:.98;letter-spacing:-.055em;margin:18px auto;max-width:850px}.hero p{max-width:650px;margin:0 auto 28px;color:var(--muted);font-size:17px;line-height:1.65}.heroactions{display:flex;justify-content:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:18px;overflow:hidden}.stat{padding:26px;text-align:center}.stat+.stat{border-left:1px solid var(--line)}.stat b{display:block;font-size:28px}.stat span{font-size:11px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:55px 0 35px}.tag{padding:8px 11px;border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:800}.section{padding:45px 0}.section h2{font-size:30px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,.item{border:1px solid var(--line);border-radius:17px;padding:22px;background:var(--bg)}.card h3{font-size:17px}.muted{color:var(--muted);font-size:12px;line-height:1.55}.loop{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.step{padding:24px;background:var(--card);border-radius:16px}.step b{font-size:12px;color:var(--p)}.step h3{margin:12px 0 7px}
.research{background:var(--dark);color:white;border-radius:22px;padding:44px;margin:35px 0}.research p{color:#bcb5c5;max-width:650px;line-height:1.7}.footer{padding:45px 0;color:var(--muted);font-size:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between}
.dash{padding:42px 0 70px}.dashhead{display:flex;justify-content:space-between;gap:15px;align-items:end}.dashhead h1{font-size:48px;text-align:left;margin:8px 0}.dash-actions{display:flex;gap:8px;flex-wrap:wrap}.dashgrid{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-top:25px}.metricgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:25px 0}.metric{border:1px solid var(--line);border-radius:15px;padding:18px}.metric b{display:block;font-size:25px;margin-top:5px}
.item{margin:9px 0}.itemhead{display:flex;justify-content:space-between;gap:10px}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;background:var(--soft);color:var(--p)}.green{background:#e7f7ef;color:#16845b}.red{background:#fdecef;color:#c43b4b}
.wallet{background:var(--dark);color:#fff;border-radius:18px;padding:22px}.wallet .muted{color:#bcb5c5}.wallet-address{font-family:monospace;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:15px 0}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:5}.modalbox{width:min(500px,100%);max-height:92vh;overflow:auto;background:white;border-radius:22px;padding:28px}.modalbox h2{margin:7px 0 10px;font-size:32px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:11px;font-weight:800}.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:11px;padding:12px;background:white}.role{display:grid;grid-template-columns:1fr 1fr;gap:9px}.role button{padding:14px;border:1px solid var(--line);border-radius:12px;background:white;text-align:left}.role button.sel{border-color:var(--p);background:var(--soft)}
.empty{padding:28px;border:1px dashed var(--line);border-radius:15px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:white;padding:11px 16px;border-radius:999px;font-size:12px;z-index:9}
@media(max-width:760px){.navlinks{display:none}.grid,.loop,.dashgrid,.metricgrid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.stat+.stat{border-left:0;border-top:1px solid var(--line)}.hero{padding:65px 0 45px}.heroactions{flex-direction:column}.footer{flex-direction:column;gap:12px}.dashhead{align-items:flex-start;flex-direction:column}.dashhead h1{font-size:38px}}
</style></head><body><div id="root"></div>
<script>
const root=document.getElementById("root");let token=localStorage.getItem("scower_token"),me=null,mode="buyer";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
const logo=()=>`<span class="mark"><svg viewBox="0 0 32 32" fill="none"><path d="M16 3.5c2.8 6.3 6.2 9.7 12.5 12.5C22.2 18.8 18.8 22.2 16 28.5 13.2 22.2 9.8 18.8 3.5 16 9.8 13.2 13.2 9.8 16 3.5Z" fill="white"/><path d="M16 8.2c1.7 3.8 3.9 6.1 7.8 7.8-3.9 1.7-6.1 3.9-7.8 7.8-1.7-3.9-3.9-6.1-7.8-7.8 3.9-1.7 6.1-4 7.8-7.8Z" fill="#7c3aed"/></svg></span>`;
async function api(p,o={}){const r=await fetch("/api"+p,{...o,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{}),...(o.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
const toast=x=>{const t=document.createElement("div");t.className="toast";t.textContent=x;document.body.append(t);setTimeout(()=>t.remove(),2600)};
function nav(){return `<nav class="nav wrap"><div class="brand">${logo()}scower</div><div class="navlinks"><a href="#" onclick="home();return false">Explore</a><a href="#how">How it works</a><a href="#researchers">Earn</a></div><div class="actions">${me?`<button class="btn" onclick="dashboard()">${esc(me.name)} · ${me.role}</button><button class="btn" onclick="logout()">Sign out</button>`:`<button class="btn primary" onclick="auth()">Create account</button>`}</div></nav>`}
function home(){root.innerHTML=nav()+`<main class="wrap"><section class="hero"><div class="eyebrow">HUMAN INTELLIGENCE MARKETPLACE</div><h1>Questions worth asking.<br>Answers worth paying for.</h1><p>Post a question. Let people with real-world knowledge investigate it. Pay only for useful, evidence-backed answers.</p><div class="heroactions"><button class="btn primary" onclick="${me?.role==="buyer"?"create()":"auth()"}">Post a question ↗</button><button class="btn" onclick="document.getElementById('explore').scrollIntoView()">Explore open questions</button></div></section><div class="stats"><div class="stat"><b>$2,840</b><span>paid to researchers</span></div><div class="stat"><b>418</b><span>questions answered</span></div><div class="stat"><b>96%</b><span>answers accepted</span></div></div><div class="tags"><span class="tag">RESEARCH</span><span class="tag">VERIFICATION</span><span class="tag">LOCAL KNOWLEDGE</span><span class="tag">FIELD INTELLIGENCE</span><span class="tag">DATA COLLECTION</span></div><section id="explore" class="section"><h2>Things people need to know.</h2><div id="bounties" class="grid"></div></section><section id="how" class="section"><h2>The loop.</h2><div class="loop">${["Ask|Turn a question nobody has time to answer into a paid research task.","Investigate|Researchers submit evidence, context and first-hand knowledge.","Verify|Submissions are reviewed for evidence, accuracy and usefulness.","Pay|Accepted contributors receive their payout automatically."].map((x,i)=>{let[a,b]=x.split("|");return `<div class="step"><b>0${i+1}</b><h3>${a}</h3><div class="muted">${b}</div></div>`}).join("")}</div></section><section id="researchers" class="research"><div class="eyebrow">FOR RESEARCHERS</div><h2>Your knowledge is an asset.</h2><p>Spot questions you can answer. Submit proof. Build reputation. Get paid for what you know — even when the answer is worth only a few cents.</p><button class="btn primary" onclick="${me?.role==="researcher"?"dashboard()":"auth()"}">Start earning →</button></section></main><footer class="footer wrap"><span>© 2026 Scower</span><span>Built for the x402 era · Algorand settlement</span></footer>`;loadBounties()}
async function loadBounties(){try{let b=await api("/bounties");document.getElementById("bounties").innerHTML=b.map(x=>`<article class="card"><div class="eyebrow">${esc(x.category)} · $${x.budget}</div><h3>${esc(x.title)}</h3><div class="muted">${x.submissions} submissions</div><br><button class="btn" onclick="view(${x.id})">View bounty →</button></article>`).join("")||`<p class="muted">No bounties yet. Create the first one.</p>`}catch(e){document.getElementById("bounties").innerHTML=`<p class="muted">Unable to load questions.</p>`}}
function auth(){root.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="modalbox"><div class="eyebrow">SCOWER ACCOUNT</div><h2 id="at">Create account.</h2><p class="muted">Real accounts. Passwords are checked by the Scower server.</p><div class="field" id="nf"><label>Name</label><input id="name"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password (8+ characters)</label><input id="password" type="password"></div><div class="field" id="rf"><label>I'm here as</label><div class="role"><button id="rb" class="sel" onclick="mode='buyer';rb.className='sel';rr.className=''">Buyer<br><small>I need answers</small></button><button id="rr" onclick="mode='researcher';rr.className='sel';rb.className=''">Researcher<br><small>I sell knowledge</small></button></div></div><button id="as" class="btn primary" style="width:100%" onclick="signup()">Create account</button><button id="ls" class="btn" style="width:100%;margin-top:8px" onclick="loginMode()">I already have an account</button><button class="btn" style="width:100%;margin-top:8px" onclick="modal.remove()">Cancel</button></div></div>`)}
function loginMode(){at.textContent="Sign in.";nf.style.display="none";rf.style.display="none";as.textContent="Sign in";as.onclick=login;ls.style.display="none"}
async function signup(){try{let d=await api("/auth/signup",{method:"POST",body:JSON.stringify({name:name.value.trim(),email:email.value.trim(),password:password.value,role:mode})});token=d.token;localStorage.setItem("scower_token",token);me=d.user;modal.remove();dashboard()}catch(e){toast(e.message)}}
async function login(){try{let d=await api("/auth/login",{method:"POST",body:JSON.stringify({email:email.value.trim(),password:password.value})});token=d.token;localStorage.setItem("scower_token",token);me=d.user;modal.remove();dashboard()}catch(e){toast(e.message)}}
function logout(){localStorage.removeItem("scower_token");token=null;me=null;home()}
async function dashboard(){me=await api("/me");me.role==="buyer"?buyer():researcher()}
function metrics(){return `<div class="metricgrid"><div class="metric"><span class="muted">Reputation</span><b>${me.reputation||0}</b></div><div class="metric"><span class="muted">Earnings</span><b>$${Number(me.earnings||0).toFixed(2)}</b></div><div class="metric"><span class="muted">Role</span><b>${me.role}</b></div><div class="metric"><span class="muted">Wallet</span><b>${me.wallet_address?"Connected":"Not set"}</b></div></div>`}
async function buyer(){root.innerHTML=nav()+`<main class="wrap dash"><div class="dashhead"><div><div class="eyebrow">BUYER DASHBOARD</div><h1>Get the answer.<br>Fund the question.</h1><p class="muted">Create research tasks, review submissions and pay for useful intelligence.</p></div><div class="dash-actions"><button class="btn primary" onclick="create()">＋ Create question</button><button class="btn" onclick="wallet()">Wallet</button></div></div>${metrics()}<div class="dashgrid"><section><h2>My questions</h2><div id="mine"><div class="empty">Loading…</div></div></section><aside><div class="wallet"><div class="eyebrow">PAYMENT WALLET</div><h2>Algorand</h2><p class="muted">Connect the buyer wallet used to fund Scower bounties.</p><div class="wallet-address">${esc(me.wallet_address||"No wallet connected")}</div><button class="btn primary" onclick="wallet()">Connect wallet</button></div></aside></div></main>`;let b=await api("/my/bounties");mine.innerHTML=b.map(x=>`<article class="item"><div class="itemhead"><div><span class="badge">${esc(x.category)}</span><h3>${esc(x.title)}</h3></div><b>$${x.budget}</b></div><div class="muted">${x.submissions} submissions · ${x.status}</div><br><button class="btn" onclick="view(${x.id})">Review submissions →</button></article>`).join("")||`<div class="empty">No questions yet.<br><br><button class="btn primary" onclick="create()">Create your first question</button></div>`}
async function researcher(){root.innerHTML=nav()+`<main class="wrap dash"><div class="dashhead"><div><div class="eyebrow">RESEARCHER DASHBOARD</div><h1>Sell what<br>you know.</h1><p class="muted">Find questions, submit evidence and track accepted work.</p></div><div class="dash-actions"><button class="btn primary" onclick="home()">Browse questions</button><button class="btn" onclick="wallet()">Wallet</button></div></div>${metrics()}<div class="dashgrid"><section><h2>My submissions</h2><div id="subs"><div class="empty">Loading…</div></div></section><aside><div class="wallet"><div class="eyebrow">RESEARCHER WALLET</div><h2>$${Number(me.earnings||0).toFixed(2)}</h2><p class="muted">Accepted work is tracked here. On-chain settlement is the next payment layer.</p><div class="wallet-address">${esc(me.wallet_address||"No wallet connected")}</div><button class="btn primary" onclick="wallet()">Connect wallet</button></div></aside></div></main>`;let s=await api("/my/submissions");subs.innerHTML=s.map(x=>`<article class="item"><div class="itemhead"><div><span class="badge">${esc(x.category)}</span><h3>${esc(x.title)}</h3></div><b>$${x.budget}</b></div><div class="muted">Status: ${esc(x.status)}</div><p>${esc(x.answer)}</p></article>`).join("")||`<div class="empty">No submissions yet.<br><br><button class="btn primary" onclick="home()">Find a question</button></div>`}
function wallet(){root.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="modalbox"><div class="eyebrow">ALGORAND WALLET</div><h2>Connect wallet.</h2><p class="muted">Save your Algorand address to your Scower account. This is the account association; x402 settlement is handled server-side.</p><div class="field"><label>Algorand address</label><input id="wa" value="${esc(me.wallet_address||"")}" placeholder="Algorand address"></div><button class="btn primary" style="width:100%" onclick="saveWallet()">Save wallet</button><button class="btn" style="width:100%;margin-top:8px" onclick="modal.remove()">Cancel</button></div></div>`)}
async function saveWallet(){try{me=await api("/me/wallet",{method:"PUT",body:JSON.stringify({wallet_address:wa.value.trim()})});modal.remove();dashboard()}catch(e){toast(e.message)}}
function create(){root.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="modalbox"><div class="eyebrow">NEW QUESTION</div><h2>Create a bounty.</h2><div class="field"><label>Question</label><input id="bt" placeholder="What do you need to know?"></div><div class="field"><label>Description / requirements</label><textarea id="bd" rows="5" placeholder="Define the evidence and scope you need."></textarea></div><div class="field"><label>Category</label><select id="bc"><option>RESEARCH</option><option>VERIFICATION</option><option>LOCAL KNOWLEDGE</option><option>FIELD INTELLIGENCE</option><option>DATA COLLECTION</option></select></div><div class="field"><label>Bounty (USDC)</label><input id="bb" type="number" min=".01" step=".01" value="5"></div><button class="btn primary" style="width:100%" onclick="postBounty()">Create question</button><button class="btn" style="width:100%;margin-top:8px" onclick="modal.remove()">Cancel</button></div></div>`)}
async function postBounty(){try{await api("/bounties",{method:"POST",body:JSON.stringify({title:bt.value.trim(),description:bd.value.trim(),category:bc.value,budget:bb.value})});modal.remove();toast("Question created.");buyer()}catch(e){toast(e.message)}}
async function view(id){let b=await api("/bounties/"+id);root.innerHTML=nav()+`<main class="wrap dash"><button class="btn" onclick="dashboard()">← Dashboard</button><section class="section"><div class="eyebrow">${esc(b.category)} · $${b.budget}</div><h1 style="font-size:44px;text-align:left">${esc(b.title)}</h1><p class="muted">${esc(b.description)}</p><h2>${b.submissions.length} submissions</h2>${b.submissions.map(s=>`<article class="item"><div class="itemhead"><b>${esc(s.researcher)}</b><span class="badge">Reputation ${s.reputation}</span></div><p>${esc(s.answer)}</p><p class="muted">Evidence: ${esc(s.evidence)}</p>${me?.role==="buyer"&&String(me.id)===String(b.buyer_id)&&s.status==="pending"?`<button class="btn primary" onclick="decide(${s.id},'accepted',${b.id})">Accept & Pay $${b.budget}</button> <button class="btn" onclick="decide(${s.id},'rejected',${b.id})">Reject</button>`:`<span class="badge ${s.status==="accepted"?"green":s.status==="rejected"?"red":""}">${esc(s.status)}</span>`}</article>`).join("")||`<div class="empty">No submissions yet.</div>`}${me?.role==="researcher"&&b.status!=="paid"?`<br><button class="btn primary" onclick="submitResearch(${b.id})">Submit research →</button>`:""}</section></main>`}
function submitResearch(id){root.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="modalbox"><div class="eyebrow">SUBMIT RESEARCH</div><h2>Show your work.</h2><div class="field"><label>Answer</label><textarea id="sa" rows="6"></textarea></div><div class="field"><label>Evidence / sources</label><textarea id="se" rows="5" placeholder="Links, documents, methodology, first-hand evidence"></textarea></div><button class="btn primary" style="width:100%" onclick="sendResearch(${id})">Submit</button><button class="btn" style="width:100%;margin-top:8px" onclick="modal.remove()">Cancel</button></div></div>`)}
async function sendResearch(id){try{await api("/bounties/"+id+"/submissions",{method:"POST",body:JSON.stringify({answer:sa.value.trim(),evidence:se.value.trim()})});modal.remove();toast("Research submitted.");researcher()}catch(e){toast(e.message)}}
async function decide(id,d,b){try{await api("/submissions/"+id+"/decision",{method:"POST",body:JSON.stringify({decision:d})});toast(d==="accepted"?"Accepted — settlement pending.":"Submission rejected.");view(b)}catch(e){toast(e.message)}}
async function boot(){if(token){try{me=await api("/me")}catch{localStorage.removeItem("scower_token");token=null}}home()}boot();
</script></body></html>
