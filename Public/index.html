<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scower — Human Intelligence Marketplace</title>
<style>
:root{--bg:#fff;--card:#f7f6fb;--text:#17131f;--muted:#716a7c;--line:#e7e2ed;--p:#7c3aed;--soft:#eee7ff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1120px;margin:auto;padding:0 22px}.nav{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px}.mark{width:34px;height:34px;border-radius:11px;background:var(--p);display:grid;place-items:center;color:white;font-weight:900}.navlinks{display:flex;gap:26px;font-size:13px}.navlinks a{color:var(--muted);text-decoration:none}.actions{display:flex;gap:9px;align-items:center}.btn{border:1px solid var(--line);background:white;padding:11px 15px;border-radius:10px;font-weight:800;font-size:12px}.primary{background:var(--p);color:#fff;border-color:var(--p)}.hero{text-align:center;padding:92px 0 70px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.16em;color:var(--p)}h1{font-size:clamp(44px,7vw,78px);line-height:.98;letter-spacing:-.055em;margin:18px auto;max-width:850px}.hero p{max-width:650px;margin:0 auto 28px;color:var(--muted);font-size:17px;line-height:1.65}.heroactions{display:flex;justify-content:center;gap:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:18px;overflow:hidden}.stat{padding:26px;text-align:center}.stat+ .stat{border-left:1px solid var(--line)}.stat b{display:block;font-size:28px}.stat span{font-size:11px;color:var(--muted)}.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:55px 0 35px}.tag{padding:8px 11px;border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:800}.section{padding:45px 0}.section h2{font-size:30px;letter-spacing:-.03em}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{border:1px solid var(--line);border-radius:17px;padding:22px;background:var(--bg)}.card h3{font-size:17px;line-height:1.3}.muted{color:var(--muted);font-size:12px}.price{font-weight:900;font-size:20px}.loop{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.step{padding:24px;background:var(--card);border-radius:16px}.step b{font-size:12px;color:var(--p)}.step h3{margin:12px 0 7px}.research{background:#17131f;color:white;border-radius:22px;padding:44px;margin:35px 0}.research p{color:#bcb5c5;max-width:650px;line-height:1.7}.footer{padding:45px 0;color:var(--muted);font-size:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between}.app{display:none}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:5}.modalbox{width:min(460px,100%);background:white;border-radius:20px;padding:26px;box-shadow:0 25px 80px #0003}.modalbox h2{margin:7px 0 10px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:11px;font-weight:800}.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:10px;padding:11px}.role{display:grid;grid-template-columns:1fr 1fr;gap:9px}.role button{padding:13px;border:1px solid var(--line);border-radius:11px;background:white;text-align:left}.role button.sel{border-color:var(--p);background:var(--soft)}.dash{padding:45px 0}.dashhead{display:flex;justify-content:space-between;gap:15px;align-items:end}.dashgrid{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-top:25px}.item{border:1px solid var(--line);padding:18px;border-radius:14px;margin:9px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17131f;color:white;padding:11px 16px;border-radius:999px;font-size:12px;z-index:9}@media(max-width:760px){.navlinks{display:none}.grid,.loop,.dashgrid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.stat+.stat{border-left:0;border-top:1px solid var(--line)}.hero{padding:65px 0 45px}.heroactions{flex-direction:column}.footer{flex-direction:column;gap:12px}}
</style></head>
<body><div id="root"></div><script>
const root=document.getElementById("root");let token=localStorage.getItem("scower_token"),me=null,mode="buyer";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
async function api(path,opt={}){const r=await fetch("/api"+path,{...opt,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{}),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
function toast(x){const t=document.createElement("div");t.className="toast";t.textContent=x;document.body.append(t);setTimeout(()=>t.remove(),2600)}
function nav(){return `<nav class="nav wrap"><div class="brand"><span class="mark">S</span>scower</div><div class="navlinks"><a href="#explore">Explore</a><a href="#how">How it works</a><a href="#researchers">Earn</a></div><div class="actions">${me?`<button class="btn" onclick="dashboard()">${esc(me.name)} · ${me.role}</button><button class="btn" onclick="logout()">Sign out</button>`:`<button class="btn primary" onclick="auth()">Create account</button>`}</div></nav>`}
function home(){root.innerHTML=nav()+`<main class="wrap"><section class="hero"><div class="eyebrow">HUMAN INTELLIGENCE MARKETPLACE</div><h1>Questions worth asking.<br>Answers worth paying for.</h1><p>Post a question. Let people with real-world knowledge investigate it. Pay only for useful, evidence-backed answers.</p><div class="heroactions"><button class="btn primary" onclick="${me?.role==="buyer"?"create()":"auth()"}>Post a question ↗</button><button class="btn" onclick="explore()">Explore open questions</button></div></section><div class="stats"><div class="stat"><b>$2,840</b><span>paid to researchers</span></div><div class="stat"><b>418</b><span>questions answered</span></div><div class="stat"><b>96%</b><span>answers accepted</span></div></div><div class="tags"><span class="tag">RESEARCH</span><span class="tag">VERIFICATION</span><span class="tag">LOCAL KNOWLEDGE</span><span class="tag">FIELD INTELLIGENCE</span><span class="tag">DATA COLLECTION</span></div><section id="explore" class="section"><h2>Things people need to know.</h2><div id="bounties" class="grid"></div></section><section id="how" class="section"><h2>The loop.</h2><div class="loop">${["Ask|Turn a question nobody has time to answer into a paid research task.","Investigate|Researchers submit evidence, context and first-hand knowledge.","Verify|Submissions are reviewed for evidence, accuracy and usefulness.","Pay|Accepted contributors receive their payout automatically."].map((x,i)=>{let[a,b]=x.split("|");return `<div class="step"><b>0${i+1}</b><h3>${a}</h3><div class="muted">${b}</div></div>`}).join("")}</div></section><section id="researchers" class="research"><div class="eyebrow">FOR RESEARCHERS</div><h2>Your knowledge is an asset.</h2><p>Spot questions you can answer. Submit proof. Build reputation. Get paid for what you know — even when the answer is worth only a few cents.</p><button class="btn primary" onclick="${me?.role==="researcher"?"explore()":"auth()"}">Start earning →</button></section></main><footer class="footer wrap"><span>© 2026 Scower</span><span>Built for the x402 era · Algorand settlement</span></footer>`;loadBounties()}
async function loadBounties(){try{const bs=await api("/bounties");document.getElementById("bounties").innerHTML=bs.slice(0,6).map(b=>`<article class="card"><div class="eyebrow">${esc(b.category)} · $${b.budget}</div><h3>${esc(b.title)}</h3><div class="muted">${b.submissions} submissions</div><br><button class="btn" onclick="view(${b.id})">View bounty →</button></article>`).join("")||"<p class='muted'>No bounties yet. Create the first one.</p>"}catch(e){document.getElementById("bounties").innerHTML="<p class='muted'>Database is not connected yet.</p>"}}
function auth(){root.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="modalbox"><div class="eyebrow">SCOWER ACCOUNT</div><h2 id="authTitle">Create account.</h2><p class="muted">Real accounts. Passwords are verified by the Scower server.</p><div class="field" id="nameField"><label>Name</label><input id="name" placeholder="Your name"></div><div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div><div class="field"><label>Password (8+ characters)</label><input id="password" type="password"></div><div class="field" id="roleField"><label>I'm here as</label><div class="role"><button id="rb" class="sel" onclick="mode='buyer';rb.className='sel';rr.className=''">Buyer<br><small>I need answers</small></button><button id="rr" onclick="mode='researcher';rr.className='sel';rb.className=''">Researcher<br><small>I sell knowledge</small></button></div></div><button class="btn primary" style="width:100%;margin-top:8px" onclick="signup()">Create account</button><button class="btn" style="width:100%;margin-top:8px" onclick="loginMode()">I already have an account</button><button class="btn" style="width:100%;margin-top:8px" onclick="document.getElementById('modal').remove()">Cancel</button></div></div>`)}
function loginMode(){document.getElementById("authTitle").textContent="Sign in.";document.getElementById("nameField").style.display="none";document.getElementById("roleField").style.display="none";document.querySelector("#modal .primary").textContent="Sign in";document.querySelector("#modal .primary").onclick=login;document.querySelector("#modal .btn:nth-last-child(2)").style.display="none"}
async function signup(){try{const d=await api("/auth/signup",{method:"POST",body:JSON.stringify({name:name.value,email:email.value,password:password.value,role:mode})});token=d.token;localStorage.setItem("scower_token",token);me=d.user;document.getElementById("modal").remove();toast("Account created.");home()}catch(e){toast(e.message)}}
async function login(){try{const d=await api("/auth/login",{method:"POST",body:JSON.stringify({email:email.value,password:password.value})});token=d.token;localStorage.setItem("scower_token",token);me=d.user;document.getElementById("modal").remove();toast("Signed in.");home()}catch(e){toast(e.message)}}
function logout(){localStorage.removeItem("scower_token");token=null;me=null;home()}
async function create(){if(!me||me.role!=="buyer")return auth();root.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="modalbox"><div class="eyebrow">NEW BOUNTY</div><h2>Ask something worth paying for.</h2><div class="field"><label>Question</label><input id="bt" placeholder="What do you need to know?"></div><div class="field"><label>Description</label><textarea id="bd" rows="4" placeholder="Define the evidence and scope you need."></textarea></div><div class="field"><label>Category</label><select id="bc"><option>RESEARCH</option><option>VERIFICATION</option><option>LOCAL KNOWLEDGE</option><option>FIELD INTELLIGENCE</option><option>DATA COLLECTION</option></select></div><div class="field"><label>Reward (USD demo amount)</label><input id="bb" type="number" min="0.01" step=".01" value="5"></div><button class="btn primary" style="width:100%" onclick="postBounty()">Create bounty</button><button class="btn" style="width:100%;margin-top:8px" onclick="document.getElementById('modal').remove()">Cancel</button></div></div>`)}
async function postBounty(){try{await api("/bounties",{method:"POST",body:JSON.stringify({title:bt.value,description:bd.value,category:bc.value,budget:bb.value})});document.getElementById("modal").remove();toast("Bounty created.");home()}catch(e){toast(e.message)}}
async function explore(){location.hash="explore";const el=document.getElementById("bounties");if(el)el.scrollIntoView({behavior:"smooth"})}
async function view(id){const b=await api("/bounties/"+id);root.innerHTML=nav()+`<main class="wrap dash"><button class="btn" onclick="home()">← Home</button><div class="dashhead"><div><div class="eyebrow">${esc(b.category)} · $${b.budget}</div><h1 style="font-size:44px;text-align:left">${esc(b.title)}</h1><p class="muted">${esc(b.description)}</p></div></div><section class="section"><h2>${b.submissions.length} submissions</h2>${b.submissions.map(s=>`<article class="item"><b>${esc(s.researcher)}</b> · reputation ${s.reputation}<p>${esc(s.answer)}</p><p class="muted">Evidence: ${esc(s.evidence)}</p>${me&&me.role==="buyer"&&me.id===b.buyer_id&&s.status==="pending"?`<button class="btn primary" onclick="decide(${s.id},'accepted',${b.id})">Accept & Pay $${b.budget}</button> <button class="btn" onclick="decide(${s.id},'rejected',${b.id})">Reject</button>`:`<span class="muted">Status: ${s.status}</span>`}</article>`).join("")||"<p class='muted'>No submissions yet.</p>"}</section>${me?.role==="researcher"&&b.status!=="paid"?`<button class="btn primary" onclick="submitTo(${b.id})">Submit research + evidence</button>`:""}</main>`}
async function decide(id,decision,bid){try{const d=await api("/submissions/"+id+"/decision",{method:"POST",body:JSON.stringify({decision})});toast(decision==="accepted"?`Accepted. $${d.amount} payout recorded.`:"Submission rejected.");view(bid)}catch(e){toast(e.message)}}
function submitTo(id){root.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="modalbox"><div class="eyebrow">SUBMIT RESEARCH</div><h2>Your evidence.</h2><div class="field"><label>Answer</label><textarea id="sa" rows="7"></textarea></div><div class="field"><label>Evidence / source links</label><textarea id="se" rows="4" placeholder="URLs, documents, field notes..."></textarea></div><button class="btn primary" style="width:100%" onclick="sendSubmission(${id})">Submit</button><button class="btn" style="width:100%;margin-top:8px" onclick="document.getElementById('modal').remove()">Cancel</button></div></div>`)}
async function sendSubmission(id){try{await api("/bounties/"+id+"/submissions",{method:"POST",body:JSON.stringify({answer:sa.value,evidence:se.value})});document.getElementById("modal").remove();toast("Research submitted.");view(id)}catch(e){toast(e.message)}}
async function dashboard(){if(!me)return auth();const data=me.role==="buyer"?await api("/my/bounties"):await api("/my/submissions");root.innerHTML=nav()+`<main class="wrap dash"><div class="dashhead"><div><div class="eyebrow">${me.role.toUpperCase()} DASHBOARD</div><h1 style="font-size:48px;text-align:left">${esc(me.name)}.</h1><p class="muted">${me.role==="buyer"?"Create questions, review submissions and pay for useful intelligence.":"Find questions, submit evidence, track status and build reputation."}</p></div>${me.role==="buyer"?`<button class="btn primary" onclick="create()">New bounty</button>`:""}</div><div class="stats" style="margin-top:30px"><div class="stat"><b>${me.reputation}</b><span>reputation</span></div><div class="stat"><b>$${Number(me.earnings).toFixed(2)}</b><span>earnings</span></div><div class="stat"><b>${data.length}</b><span>${me.role==="buyer"?"bounties":"submissions"}</span></div></div><section class="section"><h2>${me.role==="buyer"?"Your bounties":"Your submissions"}</h2>${data.map(x=>`<article class="item"><b>${esc(x.title||("Submission #"+x.id))}</b><p class="muted">${x.category||""} · ${x.status}</p>${me.role==="researcher"&&x.status==="accepted"?`<strong>+$${x.budget}</strong>`:""}${me.role==="buyer"?`<button class="btn" onclick="view(${x.id})">Open →</button>`:""}</article>`).join("")||"<p class='muted'>Nothing here yet.</p>"}</section></main>`}
(async()=>{if(token){try{me=await api("/me")}catch{localStorage.removeItem("scower_token");token=null}}home()})();
</script></body></html>
